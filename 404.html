<!DOCTYPE html>
<html lang="en">

<head>
  <script type="text/javascript">
    (function () {
      var pathname = window.location.pathname;

      // Forward /redirect/... to /redirect/?address so redirect/index.html handles it
      if (pathname.indexOf('/redirect') !== -1) {
        var rawSearch = window.location.search.replace(/^\?/, '');
        var rawPath = pathname.replace(/^.*\/redirect\/?/, '').replace(/^\/+/, '');
        if (rawPath === 'index.html' || rawPath === 'index.htm') {
          rawPath = '';
        }
        var rawHash = window.location.hash.replace(/^#/, '');
        var params = new URLSearchParams(window.location.search);
        var queryAddress = params.get('address') || params.get('code') || params.get('room') || params.get('ip');
        var address = queryAddress || (rawSearch.indexOf('=') === -1 ? rawSearch : '') || rawPath || rawHash || '';
        address = address.trim();

        window.location.replace('/redirect/?' + address);
        return;
      }

      // Handle /play/... routes directly on GitHub Pages by booting the WebGL player
      if (pathname.indexOf('/play') !== -1) {
        document.documentElement.classList.add('is-play-mode');
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
  <title>Page Not Found – Sync - Sink</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/syrupygames.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=1.1.4" />
  <style>
    * {
      font-family: 'Baloo 2', cursive, sans-serif !important;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 10%, rgba(137, 196, 225, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 85%, rgba(91, 173, 78, 0.18) 0%, transparent 50%),
        var(--clr-cream);
      color: var(--clr-text);
      padding: 90px 20px 40px;
    }

    #error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
      background: var(--clr-white);
      border: 2px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: 44px 32px;
      box-shadow: var(--shadow-card);
      margin: 0 auto;
    }

    .err-code {
      font-size: clamp(5rem, 16vw, 7.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--clr-water), var(--clr-water-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .err-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--clr-text);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .err-sub {
      color: var(--clr-text-muted);
      font-size: 1.1rem;
      font-weight: 600;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .err-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .err-actions .btn-primary {
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 50px;
      text-decoration: none;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-store-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      width: auto;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-store-badge:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-store-badge img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Unity WebGL Player Styles */
    html.is-play-mode,
    html.is-play-mode body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      background: #231F20 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    html.is-play-mode #navbar,
    html.is-play-mode #error-container {
      display: none !important;
    }

    html.is-play-mode #unity-container {
      display: block !important;
    }

    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      display: none;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #231F20;
      display: block;
      outline: none;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url('/assets/webglBuild/TemplateData/unity-logo-dark.png') no-repeat center;
      background-size: contain;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      background: url('/assets/webglBuild/TemplateData/progress-bar-empty-dark.png') no-repeat center;
      position: relative;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: url('/assets/webglBuild/TemplateData/progress-bar-full-dark.png') no-repeat left center;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 20;
    }
  </style>
</head>

<body>
  <!-- Standard Site Navigation -->
  <nav id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <img src="/assets/title2.png" alt="Sync - Sink" class="nav-logo-img" />
      </a>
      <div class="nav-links">
        <a href="/#about">About</a>
        <a href="/#features">Features</a>
        <a href="/#download">Download</a>
        <a href="/presskit/index.html">Press Kit</a>
      </div>
    </div>
  </nav>

  <!-- Standard 404 Nature Card Container -->
  <div id="error-container">
    <div class="err-code">404</div>
    <h1 class="err-title">You sank.</h1>
    <p class="err-sub">This page drifted off course — or maybe it never existed. Let's get you back to shore.</p>

    <div class="err-actions">
      <a href="/" class="btn-primary">
        ← Back to Shore
      </a>
    </div>
  </div>

  <!-- Unity WebGL Player Container (Activated for /play/... routes) -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    if (window.location.pathname.indexOf('/play') !== -1) {
      document.title = "Sync - Sink";

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; color: black; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "/assets/webglBuild/Build";
      var loaderUrl = buildUrl + "/webglBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webglBuild.data.unityweb",
        frameworkUrl: buildUrl + "/webglBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/webglBuild.wasm.unityweb",
        streamingAssetsUrl: "/assets/webglBuild/StreamingAssets",
        companyName: "SyrupyGames",
        productName: "Sync - Sink",
        productVersion: "1.1.8",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    }
  </script>
</body>

</html>
