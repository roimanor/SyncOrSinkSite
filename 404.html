<!DOCTYPE html>
<html lang="en">

<head>
  <script type="text/javascript">
    (function () {
      var pathname = window.location.pathname;

      // Forward /redirect/... to /redirect/?address so redirect/index.html handles it
      if (pathname.indexOf('/redirect') !== -1) {
        var rawSearch = window.location.search.replace(/^\?/, '');
        var rawPath = pathname.replace(/^.*\/redirect\/?/, '').replace(/^\/+/, '');
        if (rawPath === 'index.html' || rawPath === 'index.htm') {
          rawPath = '';
        }
        var rawHash = window.location.hash.replace(/^#/, '');
        var params = new URLSearchParams(window.location.search);
        var queryAddress = params.get('address') || params.get('code') || params.get('room') || params.get('ip');
        var address = queryAddress || (rawSearch.indexOf('=') === -1 ? rawSearch : '') || rawPath || rawHash || '';
        address = address.trim();

        window.location.replace('/redirect/?' + address);
        return;
      }

      // Handle /play/... routes directly on GitHub Pages by booting the WebGL player
      if (pathname.indexOf('/play') !== -1) {
        document.documentElement.classList.add('is-play-mode');
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
  <title>Page Not Found – Sync - Sink</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/syrupygames.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=1.1.4" />
  <style>
    * {
      font-family: 'Baloo 2', cursive, sans-serif !important;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 10%, rgba(137, 196, 225, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 85%, rgba(91, 173, 78, 0.18) 0%, transparent 50%),
        var(--clr-cream);
      color: var(--clr-text);
      padding: 90px 20px 40px;
    }

    #error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
      background: var(--clr-white);
      border: 2px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: 44px 32px;
      box-shadow: var(--shadow-card);
      margin: 0 auto;
    }

    .err-code {
      font-size: clamp(5rem, 16vw, 7.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--clr-water), var(--clr-water-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .err-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--clr-text);
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .err-sub {
      color: var(--clr-text-muted);
      font-size: 1.1rem;
      font-weight: 600;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .err-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .err-actions .btn-primary {
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 50px;
      text-decoration: none;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-store-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      width: auto;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-store-badge:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-store-badge img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Unity WebGL Player Styles */
    html.is-play-mode,
    html.is-play-mode body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      background: #231F20 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    html.is-play-mode #navbar,
    html.is-play-mode #error-container {
      display: none !important;
    }

    html.is-play-mode #unity-container {
      display: block !important;
    }

    #unity-container {
      position: fixed !important;
      width: 100vw !important;
      height: 100vh !important;
      left: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      display: none;
      z-index: 1000;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #000;
      display: block !important;
      outline: none !important;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1100;
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url('/assets/webglBuild/TemplateData/unity-logo-dark.png') no-repeat center;
      background-size: contain;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      background: url('/assets/webglBuild/TemplateData/progress-bar-empty-dark.png') no-repeat center;
      position: relative;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: url('/assets/webglBuild/TemplateData/progress-bar-full-dark.png') no-repeat left center;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 1200;
    }

    #fullscreen-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 2000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    #fullscreen-btn:hover {
      transform: scale(1.08);
      background: rgba(0, 0, 0, 0.85);
      border-color: rgba(0, 184, 204, 0.85);
      box-shadow: 0 6px 20px rgba(0, 184, 204, 0.45);
    }
  </style>
</head>

<body>
  <!-- Standard Site Navigation -->
  <nav id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <img src="/assets/title2.png" alt="Sync - Sink" class="nav-logo-img" />
      </a>
      <div class="nav-links">
        <a href="/#about">About</a>
        <a href="/#features">Features</a>
        <a href="/#download">Download</a>
        <a href="/presskit/index.html">Press Kit</a>
      </div>
    </div>
  </nav>

  <!-- Standard 404 Nature Card Container -->
  <div id="error-container">
    <div class="err-code">404</div>
    <h1 class="err-title">You sank.</h1>
    <p class="err-sub">This page drifted off course — or maybe it never existed. Let's get you back to shore.</p>

    <div class="err-actions">
      <a href="/" class="btn-primary">
        ← Back to Shore
      </a>
    </div>
  </div>

  <!-- Unity WebGL Player Container (Activated for /play/... routes) -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <button id="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
    </svg>
  </button>

  <script>
    if (window.location.pathname.indexOf('/play') !== -1) {
      document.title = "Sync - Sink";

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var fullscreenBtn = document.querySelector("#fullscreen-btn");
      var myUnityInstance = null;

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; color: black; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "/assets/webglBuild/Build";
      var loaderUrl = buildUrl + "/webglBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webglBuild.data.unityweb",
        frameworkUrl: buildUrl + "/webglBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/webglBuild.wasm.unityweb",
        streamingAssetsUrl: "/assets/webglBuild/StreamingAssets",
        companyName: "SyrupyGames",
        productName: "Sync - Sink",
        productVersion: "1.1.8",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true,
      };

      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          myUnityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenBtn.style.display = "flex";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);

      fullscreenBtn.onclick = function () {
        if (myUnityInstance) {
          myUnityInstance.SetFullscreen(1);
        } else if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function (e) { });
        } else {
          document.exitFullscreen().catch(function (e) { });
        }
      };

      // Keep Screen Awake (Prevent screen from turning off)
      var wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator && navigator.wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', function () {
              wakeLock = null;
            });
          }
        } catch (err) {}
      }

      requestWakeLock();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
      window.addEventListener('click', requestWakeLock);
      window.addEventListener('touchstart', requestWakeLock);
      window.addEventListener('pointerdown', requestWakeLock);

      // Force Vertical: when switched to horizontal, keep displaying vertical
      function enforceOrientation() {
        var isLandscape = window.innerWidth > window.innerHeight;
        var container = document.getElementById("unity-container");

        if (!isLandscape) {
          // Vertical (Portrait) mode
          container.style.width = "100vw";
          container.style.height = "100vh";
          container.style.left = "0";
          container.style.top = "0";
          container.style.transform = "none";
          canvas.style.width = "100vw";
          canvas.style.height = "100vh";
        } else {
          // Switched to horizontal - keep displaying vertical!
          var angle = (screen.orientation && screen.orientation.angle) !== undefined
            ? screen.orientation.angle
            : (window.orientation !== undefined ? window.orientation : 90);
          var rot = (angle === 270 || angle === -90) ? 90 : -90;

          container.style.width = "100vh";
          container.style.height = "100vw";
          container.style.left = "50%";
          container.style.top = "50%";
          container.style.transform = "translate(-50%, -50%) rotate(" + rot + "deg)";
          container.style.transformOrigin = "center center";

          canvas.style.width = "100vh";
          canvas.style.height = "100vw";
        }

        // Lock device orientation to portrait if supported
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function () {});
          } else if (screen.lockOrientation) {
            screen.lockOrientation('portrait');
          }
        } catch (e) {}
      }

      enforceOrientation();
      window.addEventListener("resize", enforceOrientation);
      window.addEventListener("orientationchange", enforceOrientation);
      document.addEventListener("fullscreenchange", enforceOrientation);
      window.addEventListener("click", enforceOrientation);
      window.addEventListener("touchstart", enforceOrientation);

      // Auto-enter F11 hardware fullscreen on first user touch/click for Android
      var isAndroid = /Android/i.test(navigator.userAgent);
      function triggerAndroidFullscreen() {
        if (isAndroid && !document.fullscreenElement) {
          if (myUnityInstance) {
            myUnityInstance.SetFullscreen(1);
          } else {
            var el = document.documentElement;
            var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (rfs) rfs.call(el).catch(function () {});
          }
        }
      }
      window.addEventListener("click", triggerAndroidFullscreen, { once: true });
      window.addEventListener("touchstart", triggerAndroidFullscreen, { once: true });
      window.addEventListener("pointerdown", triggerAndroidFullscreen, { once: true });
    }
  </script>
</body>

</html>
