<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Sync - Sink</title>
  <link rel="icon" type="image/png" href="/assets/syrupygames.png">
  <script>
    (function () {
      var redirectUrl = sessionStorage.getItem('spa_redirect');
      if (redirectUrl) {
        sessionStorage.removeItem('spa_redirect');
        try {
          window.history.replaceState(null, null, redirectUrl);
        } catch (e) { }
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #000;
    }

    #unity-container {
      position: fixed !important;
      width: 100vw !important;
      height: 100vh !important;
      left: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      z-index: 100;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #000;
      display: block !important;
      outline: none !important;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url('/assets/webglBuild/TemplateData/unity-logo-dark.png') no-repeat center;
      background-size: contain;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      background: url('/assets/webglBuild/TemplateData/progress-bar-empty-dark.png') no-repeat center;
      position: relative;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: url('/assets/webglBuild/TemplateData/progress-bar-full-dark.png') no-repeat left center;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 200;
    }

    #fullscreen-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    #fullscreen-btn:hover {
      transform: scale(1.08);
      background: rgba(0, 0, 0, 0.85);
      border-color: rgba(0, 184, 204, 0.85);
      box-shadow: 0 6px 20px rgba(0, 184, 204, 0.45);
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <button id="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
    </svg>
  </button>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");
    var fullscreenBtn = document.querySelector("#fullscreen-btn");
    var myUnityInstance = null;

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; color: black; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "/assets/webglBuild/Build";
    var loaderUrl = buildUrl + "/webglBuild.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webglBuild.data.unityweb",
      frameworkUrl: buildUrl + "/webglBuild.framework.js.unityweb",
      codeUrl: buildUrl + "/webglBuild.wasm.unityweb",
      streamingAssetsUrl: "/assets/webglBuild/StreamingAssets",
      companyName: "SyrupyGames",
      productName: "Sync - Sink",
      productVersion: "1.1.8",
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
      errorHandler: function (err, url, line) {
        console.warn("Handled Unity WebGL exception:", err);
        return true; // Suppress fatal error popup
      },
    };

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        myUnityInstance = unityInstance;
        loadingBar.style.display = "none";
        fullscreenBtn.style.display = "flex";
      }).catch((message) => {
        console.warn("Unity init message:", message);
      });
    };
    document.body.appendChild(script);

    fullscreenBtn.onclick = function () {
      if (myUnityInstance && typeof myUnityInstance.SetFullscreen === 'function') {
        try {
          myUnityInstance.SetFullscreen(1);
        } catch (e) {}
      } else if (!document.fullscreenElement) {
        var el = document.documentElement;
        var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (rfs) {
          var p = rfs.call(el);
          if (p && p.catch) p.catch(function () {});
        }
      } else {
        var efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (efs) {
          var p2 = efs.call(document);
          if (p2 && p2.catch) p2.catch(function () {});
        }
      }
    };

    // Keep Screen Awake (Prevent screen from turning off)
    var wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
          var p = navigator.wakeLock.request('screen');
          if (p && p.then) {
            p.then(function (lock) {
              wakeLock = lock;
              if (wakeLock && wakeLock.addEventListener) {
                wakeLock.addEventListener('release', function () {
                  wakeLock = null;
                });
              }
            }).catch(function () {});
          }
        }
      } catch (err) {}
    }

    requestWakeLock();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // Force Vertical: when switched to horizontal, keep displaying vertical
    function enforceOrientation() {
      var isLandscape = window.innerWidth > window.innerHeight;
      var container = document.getElementById("unity-container");

      if (!isLandscape) {
        // Vertical (Portrait) mode
        container.style.width = "100vw";
        container.style.height = "100vh";
        container.style.left = "0";
        container.style.top = "0";
        container.style.transform = "none";
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
      } else {
        // Switched to horizontal - keep displaying vertical!
        var angle = (screen.orientation && screen.orientation.angle) !== undefined
          ? screen.orientation.angle
          : (window.orientation !== undefined ? window.orientation : 90);
        var rot = (angle === 270 || angle === -90) ? 90 : -90;

        container.style.width = "100vh";
        container.style.height = "100vw";
        container.style.left = "50%";
        container.style.top = "50%";
        container.style.transform = "translate(-50%, -50%) rotate(" + rot + "deg)";
        container.style.transformOrigin = "center center";

        canvas.style.width = "100vh";
        canvas.style.height = "100vw";
      }

      // Lock device orientation to portrait ONLY when in fullscreen
      if (document.fullscreenElement && screen.orientation && screen.orientation.lock) {
        try {
          var lp = screen.orientation.lock('portrait');
          if (lp && lp.catch) lp.catch(function () {});
        } catch (e) {}
      }
    }

    enforceOrientation();
    window.addEventListener("resize", enforceOrientation);
    window.addEventListener("orientationchange", enforceOrientation);
    document.addEventListener("fullscreenchange", enforceOrientation);

    // Auto-enter F11 hardware fullscreen on first user touch/click for Android
    var isAndroid = /Android/i.test(navigator.userAgent);
    function triggerAndroidFullscreen() {
      requestWakeLock();
      if (isAndroid && !document.fullscreenElement) {
        try {
          var el = document.documentElement;
          var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
          if (rfs) {
            var p = rfs.call(el);
            if (p && p.catch) p.catch(function () {});
          }
        } catch (e) {}
      }
    }
    window.addEventListener("click", triggerAndroidFullscreen, { once: true });
    window.addEventListener("touchstart", triggerAndroidFullscreen, { once: true });
    window.addEventListener("pointerdown", triggerAndroidFullscreen, { once: true });
  </script>
</body>

</html>
