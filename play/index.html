<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Sync - Sink</title>
  <link rel="icon" type="image/png" href="/assets/syrupygames.png">
  <script>
    // Intercept and shield Unity from non-fatal browser API permission rejections
    window.addEventListener('unhandledrejection', function (e) {
      var msg = (e && e.reason) ? String(e.reason.message || e.reason) : '';
      if (msg.indexOf('Permissions check failed') !== -1 || msg.indexOf('fullscreen') !== -1 || msg.indexOf('wake') !== -1 || msg.indexOf('SocketException') !== -1) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);

    window.addEventListener('error', function (e) {
      var msg = (e && e.message) ? String(e.message) : '';
      if (msg.indexOf('Permissions check failed') !== -1 || msg.indexOf('fullscreen') !== -1 || msg.indexOf('wake') !== -1 || msg.indexOf('SocketException') !== -1) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);

    (function () {
      var redirectUrl = sessionStorage.getItem('spa_redirect');
      if (redirectUrl) {
        sessionStorage.removeItem('spa_redirect');
        try {
          window.history.replaceState(null, null, redirectUrl);
        } catch (e) { }
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #000;
    }

    #unity-container {
      position: fixed !important;
      width: 100vw !important;
      height: 100vh !important;
      left: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 100;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background: #000;
      display: block !important;
      outline: none !important;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url('/assets/webglBuild/TemplateData/unity-logo-dark.png') no-repeat center;
      background-size: contain;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      background: url('/assets/webglBuild/TemplateData/progress-bar-empty-dark.png') no-repeat center;
      position: relative;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: url('/assets/webglBuild/TemplateData/progress-bar-full-dark.png') no-repeat left center;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 200;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>


  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    var myUnityInstance = null;

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; color: black; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "/assets/webglBuild/Build";
    var loaderUrl = buildUrl + "/webglBuild.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webglBuild.data.unityweb",
      frameworkUrl: buildUrl + "/webglBuild.framework.js.unityweb",
      codeUrl: buildUrl + "/webglBuild.wasm.unityweb",
      streamingAssetsUrl: "/assets/webglBuild/StreamingAssets",
      companyName: "SyrupyGames",
      productName: "Sync - Sink",
      productVersion: "1.1.8",
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
      errorHandler: function (err, url, line) {
        console.warn("Handled Unity WebGL exception:", err);
        return true; // Suppress fatal error popup
      },
    };

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        myUnityInstance = unityInstance;
        loadingBar.style.display = "none";

      }).catch((message) => {
        console.warn("Unity init message:", message);
      });
    };
    document.body.appendChild(script);



    // Keep Screen Awake (Prevent screen from turning off)
    var wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
          var p = navigator.wakeLock.request('screen');
          if (p && p.then) {
            p.then(function (lock) {
              wakeLock = lock;
              if (wakeLock && wakeLock.addEventListener) {
                wakeLock.addEventListener('release', function () {
                  wakeLock = null;
                });
              }
            }).catch(function () { });
          }
        }
      } catch (err) { }
    }

    requestWakeLock();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

  </script>
</body>

</html>
