<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Sync - Sink…</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/syrupygames.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=1.1.4" />
  <style>
    * {
      font-family: 'Baloo 2', cursive, sans-serif !important;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 10%, rgba(137, 196, 225, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 85%, rgba(91, 173, 78, 0.18) 0%, transparent 50%),
        var(--clr-cream);
      color: var(--clr-text);
      padding: 90px 20px 40px;
    }

    .redirect-card {
      max-width: 440px;
      width: 100%;
      background: var(--clr-white);
      border: 2px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: 36px 28px;
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }

    .card-title-logo {
      width: 180px;
      max-width: 70%;
      height: auto;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--clr-text);
      margin-bottom: 6px;
      line-height: 1.15;
    }

    .status {
      color: var(--clr-text-muted);
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.45;
      max-width: 360px;
    }

    .address-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--clr-sky-pale);
      border: 1.5px solid var(--clr-border-water);
      color: var(--clr-water-dark);
      padding: 5px 16px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .address-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--clr-green);
      box-shadow: 0 0 8px var(--clr-green);
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .redirect-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-bottom: 14px;
    }

    /* WebGL Play Button: Matching main page .btn-primary */
    .btn-webgl {
      width: 100%;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--clr-water), var(--clr-water-dark));
      color: #fff;
      box-shadow: var(--shadow-water);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      cursor: pointer;
    }

    .btn-webgl:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(0, 184, 204, 0.5);
      color: #fff;
    }

    .options-divider {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--clr-text-dim);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .options-divider::before,
    .options-divider::after {
      content: "";
      flex: 1;
      height: 2px;
      background: var(--clr-border);
    }

    /* Asset Store Badge Buttons */
    .btn-store-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      width: auto;
      max-width: 100%;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-store-badge:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-store-badge img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Retry app launch footer link */
    .relaunch-link {
      color: var(--clr-text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      margin-top: 6px;
      cursor: pointer;
    }

    .relaunch-link:hover {
      color: var(--clr-water-dark);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Standard Site Navigation -->
  <nav id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <img src="/assets/title2.png" alt="Sync - Sink" class="nav-logo-img" />
      </a>
      <div class="nav-links">
        <a href="/#about">About</a>
        <a href="/#features">Features</a>
        <a href="/#download">Download</a>
        <a href="/presskit/index.html">Press Kit</a>
      </div>
    </div>
  </nav>

  <div class="redirect-card">
    <img src="/assets/title2.png" alt="Sync - Sink" class="card-title-logo" />

    <h1>Opening the app…</h1>
    <p class="status">
      Launching Sync - Sink on your device.<br />
      If the app didn't open, choose how you'd like to play:
    </p>

    <div id="room-badge" class="address-badge" style="display: none;">
      <span class="address-dot"></span>
      <span>Session: <strong id="room-code"></strong></span>
    </div>

    <div class="redirect-actions">
      <!-- 1. Play on WebGL Link -->
      <a href="https://syrupygames.com/play/" id="webgl-link" class="btn-webgl">
        Play on WebGL
      </a>

      <div class="options-divider">
        <span>OR</span>
      </div>

      <!-- 2. Device Relevant App Store Asset Badge -->
      <a href="https://play.google.com/store/apps/details?id=com.SyrupyGames.SyncOrSink&hl=en" id="dest" class="btn-store-badge" target="_blank" rel="noopener" aria-label="Get it on Google Play">
        <img id="store-badge-img" src="/assets/GetItOnGooglePlay_Badge_Web_color_English.svg" alt="Get it on Google Play" />
      </a>
    </div>

    <!-- Retry opening app -->
    <a href="syncorsink://" id="relaunch-app" class="relaunch-link">
      Already have the app? Tap to open again
    </a>
  </div>

  <script type="text/javascript">
    window.onload = function () {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // Extract the address from query string (?address), path (/redirect/address), or hash (#address)
      var rawSearch = window.location.search.replace(/^\?/, '');
      var rawPath = window.location.pathname.replace(/^.*\/redirect\/?/, '').replace(/^\/+/, '');
      if (rawPath === 'index.html' || rawPath === 'index.htm') {
        rawPath = '';
      }
      var rawHash = window.location.hash.replace(/^#/, '');

      var params = new URLSearchParams(window.location.search);
      var queryAddress = params.get('address') || params.get('code') || params.get('room') || params.get('ip');

      var address = queryAddress || (rawSearch.indexOf('=') === -1 ? rawSearch : '') || rawPath || rawHash || '';
      address = address.trim();

      // Target Links
      var appScheme = "syncorsink://" + address;
      var playStoreURL = "https://play.google.com/store/apps/details?id=com.SyrupyGames.SyncOrSink&hl=en";
      var appStoreURL = "https://apps.apple.com/app/sync-or-sink/id6740000000";
      var steamURL = "https://store.steampowered.com/app/4677270/Sync_or_Sink/";
      var webglURL = "https://syrupygames.com/play/" + address;

      // Device detection
      var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
      var isAndroid = /android/i.test(userAgent);

      // Setup WebGL link
      var webglBtn = document.getElementById('webgl-link');
      if (webglBtn) {
        webglBtn.href = webglURL;
      }

      // Setup App Store asset badge button
      var storeBtn = document.getElementById('dest');
      var storeBadgeImg = document.getElementById('store-badge-img');

      if (isIOS) {
        if (storeBtn) {
          storeBtn.href = appStoreURL;
          storeBtn.setAttribute('aria-label', 'Download on App Store');
        }
        if (storeBadgeImg) {
          storeBadgeImg.src = "/assets/Download_on_App_Store/Black_lockup/SVG/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg";
          storeBadgeImg.alt = "Download on the App Store";
        }
      } else if (isAndroid) {
        if (storeBtn) {
          storeBtn.href = playStoreURL;
          storeBtn.setAttribute('aria-label', 'Get it on Google Play');
        }
        if (storeBadgeImg) {
          storeBadgeImg.src = "/assets/GetItOnGooglePlay_Badge_Web_color_English.svg";
          storeBadgeImg.alt = "Get it on Google Play";
        }
      } else {
        // Desktop / Other: Show Steam badge
        if (storeBtn) {
          storeBtn.href = steamURL;
          storeBtn.setAttribute('aria-label', 'Steam');
        }
        if (storeBadgeImg) {
          storeBadgeImg.src = "/assets/steam_brandAssets (1).svg";
          storeBadgeImg.alt = "Steam";
        }
      }

      // Setup manual relaunch link
      var relaunchBtn = document.getElementById('relaunch-app');
      if (relaunchBtn) {
        relaunchBtn.href = appScheme;
      }

      // Setup room badge
      var roomBadge = document.getElementById('room-badge');
      var roomCode = document.getElementById('room-code');
      if (roomBadge && roomCode) {
        if (address) {
          roomCode.textContent = address;
          roomBadge.style.display = 'inline-flex';
        } else {
          roomBadge.style.display = 'none';
        }
      }

      // Launch app automatically on mobile devices
      if (isIOS || isAndroid) {
        window.location.href = appScheme;
      }
    };
  </script>
</body>

</html>
